name: Erudifi
description: >-
  ErudiFi (ErudiFi Pte. Ltd., formerly Dana Cita Pte. Ltd., a Singapore-registered
  company) is an education-financing technology company on a mission to expand access
  to affordable financial services for students across Southeast Asia. It operates
  two consumer lending platforms: Bukas in the Philippines, which provides secure,
  integrated tuition installment plans in partnership with top colleges and
  universities, and Danacita in Indonesia, a peer-to-peer education-financing
  platform registered with the OJK that funds diploma, bachelor's, master's, and
  short-course programs. ErudiFi is backed by investors including 500 Global and
  Helicap. The company maintains a small public GitHub presence (internal tooling,
  a data-quality checker, and a Danacita UI kit) but publishes no public developer
  API, OpenAPI specification, SDK, or MCP server.
